# redis.stable.conf
# Minimal, stable configuration for Redis on Windows (development mode)
# Disables background saves (BGSAVE) to avoid fork/memory crashes.

bind 127.0.0.1
port 6379

# Disable snapshotting (this fixes the Windows crash)
save ""
appendonly no

# Limit memory to avoid Out-Of-Memory errors on Windows fork
maxmemory 512mb
maxmemory-policy allkeys-lru

# Keep logging minimal
loglevel notice
